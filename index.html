<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007AFF">
    <title>Sei Giunto?</title>
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.jpg">
    <link rel="apple-touch-icon" href="./icon.jpg">

    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Premium CSS Design System -->
    <link rel="stylesheet" href="./css/style.css">
    
    <!-- html2pdf for generating PDF files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>

    <!-- App Logic (ES Modules) -->
    <script type="module" src="./js/app.js"></script>
</head>
<body>

    <!-- MAIN FORM SCREEN -->
    <main id="formScreen" class="glass-panel">
        
        <!-- Header -->
        <header>
            <h2>Sei Giunto?</h2>
            <div class="status-badge">
                <span id="currentDate">--/--/----</span>
                <span class="dot"></span>
                <span>Memoria: <b id="contatoreMemoria" class="text-primary">0</b></span>
            </div>
        </header>

        <!-- Form Rows -->
        <div class="form-row">
            <div class="input-group">
                <label>Progressivo</label>
                <input type="number" id="prog">
            </div>
            <div class="input-group">
                <label>Saltuario</label>
                <input type="number" id="salt">
            </div>
        </div>

        <div class="form-row">
            <div class="input-group" style="flex: 0.8;">
                <label>Ruolo</label>
                <select id="tipoRuolo">
                    <option value="DCO">DCO</option>
                    <option value="DM">DM</option>
                </select>
            </div>
            <div class="input-group" style="flex: 1.2;">
                <label>Località</label>
                <input type="text" id="localita" value="Mestre">
            </div>
            <div class="input-group" style="flex: 0.8;">
                <label>TR.</label>
                <input type="number" id="treno">
            </div>
        </div>

        <div class="form-row">
            <div class="input-group" style="flex: 0.8;">
                <label>Giunto a</label>
                <select id="stazioneScelta">
                    <option value="SACILE">SACILE</option>
                    <option value="MANIAGO">MANIAGO</option>
                    <option value="CARNIA">CARNIA</option>
                    <option value="altro" selected>Altro...</option>
                </select>
            </div>
            <div id="colonnaTestoStazione" class="input-group flex">
                <label>Stazione</label>
                <input type="text" id="stazioneTesto" placeholder="Specifica...">
            </div>
            <div class="input-group" style="flex: 0.6;">
                <label>Binario</label>
                <input type="number" id="binario">
            </div>
        </div>

        <!-- Checkboxes -->
        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="binSx">
                <span>Proveniente dal bin di SX</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="binDx">
                <span>Proveniente dal bin di DX</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="manigliaRAR">
                <span>Azionata maniglia RAR (tr. incrociante)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="plLibero">
                <span>Sede Stradale PL KM. 65+070 Libera</span>
            </label>
        </div>

        <div class="form-row">
            <div class="input-group" style="flex: 0.6;">
                <label>Prog DCO</label>
                <input type="number" id="progDCO">
            </div>
            <div class="input-group" style="flex: 0.6;">
                <label>Salt DCO</label>
                <input type="number" id="saltDCO">
            </div>
            <div class="input-group" style="flex: 1.2;">
                <label>Firma DCO/DM</label>
                <input type="text" id="firma">
            </div>
            <div class="input-group" style="flex: 0.8;">
                <label>Ora</label>
                <input type="time" id="ora">
            </div>
        </div>

        <div class="form-row" style="margin-bottom: 24px;">
            <div class="input-group">
                <label>PDC</label>
                <input type="text" id="pdc" value="Zorzettig">
            </div>
        </div>

        <div class="form-row">
            <button onclick="salvaModulo()" class="btn btn-primary flex-1">
                <span class="btn-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
                </span>
                Salva
            </button>
            <button onclick="mostraRiepilogo()" class="btn btn-secondary flex-1">
                <span class="btn-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                </span>
                Moduli
            </button>
        </div>
    </main>

    <!-- SUMMARY SCREEN -->
    <main id="summaryScreen" class="glass-panel hidden">
        
        <header>
            <h3>Moduli in Memoria</h3>
            <button onclick="richiediSvuotaMemoria()" class="btn btn-danger" style="height: 32px; padding: 0 12px; font-size: 0.75rem;">
                <span class="btn-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </span>
                Svuota
            </button>
        </header>
        
        <div class="form-row gap-2">
            <button onclick="tornaAlForm()" class="btn btn-secondary" style="flex: 0.8;">Indietro</button>
            <button onclick="scaricaPDF()" class="btn btn-primary flex-1">PDF</button>
            <button onclick="condividi()" class="btn btn-success flex-1">Condividi</button>
        </div>

        <!-- PDF Output Container -->
        <div id="listaModuliStampati" class="modules-list">
            <!-- Filled via JS -->
        </div>
    </main>

    <!-- CUSTOM CONFIRM MODAL -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex items-center gap-3 text-danger" style="margin-bottom: 12px;">
                <svg xmlns="http://www.w3.org/2000/svg" style="width: 24px; height: 24px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                <h3 style="font-size: 1.125rem;">Attenzione</h3>
            </div>
            <p style="font-size: 0.875rem; color: var(--color-text-muted); margin-bottom: 24px; line-height: 1.5;">Vuoi cancellare tutti i moduli salvati finora? Questa azione non può essere annullata.</p>
            <div class="form-row gap-3" style="margin-bottom: 0;">
                <button onclick="chiudiModal()" class="btn btn-secondary flex-1">Annulla</button>
                <button onclick="confermaSvuotaMemoria()" class="btn btn-danger flex-1">Svuota</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toastMsg" class="toast">
        Messaggio
    </div>

</body>
</html>
